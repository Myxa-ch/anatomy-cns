<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Анатомия: ЦНС и ЧМН I–VI</title>
<meta name="description" content="Подготовка к контрольной по ЦНС и к занятию по черепным нервам I–VI: план на 3 часа, конспекты, тесты.">
<style>
:root {
  --bg: #f5f2ec;
  --surface: #fffdf9;
  --surface-2: #efebe3;
  --ink: #1d2a31;
  --muted: #5d6b72;
  --line: #ddd6c9;
  --accent: #0e6b66;
  --accent-ink: #ffffff;
  --accent-soft: #dcefec;
  --warn: #b4481b;
  --warn-soft: #fbe9df;
  --ok: #2f7d4f;
  --ok-soft: #e1f3e8;
  --bad: #b3261e;
  --bad-soft: #fbe4e2;
  --radius: 14px;
  --shadow: 0 1px 2px rgba(29,42,49,.06), 0 6px 20px rgba(29,42,49,.06);
  --serif: Georgia, "Times New Roman", "Noto Serif", serif;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
:root[data-theme="dark"] {
  --bg: #11181c;
  --surface: #182227;
  --surface-2: #1f2c32;
  --ink: #e8eef0;
  --muted: #9bacb3;
  --line: #2b3a41;
  --accent: #4fc3b9;
  --accent-ink: #0b1a1c;
  --accent-soft: #17332f;
  --warn: #f08c5a;
  --warn-soft: #3a2519;
  --ok: #5fd08a;
  --ok-soft: #173325;
  --bad: #ff8a80;
  --bad-soft: #3b1c1a;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11181c; --surface: #182227; --surface-2: #1f2c32; --ink: #e8eef0; --muted: #9bacb3;
    --line: #2b3a41; --accent: #4fc3b9; --accent-ink: #0b1a1c; --accent-soft: #17332f;
    --warn: #f08c5a; --warn-soft: #3a2519; --ok: #5fd08a; --ok-soft: #173325; --bad: #ff8a80; --bad-soft: #3b1c1a;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25);
  }
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 16px/1.6 var(--sans);
  min-height: 100vh; display: flex; flex-direction: column;
}

/* top bar */
.topbar {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 10px clamp(14px, 4vw, 32px);
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(10px); border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: center; gap: 12px; }
.logo { color: var(--accent); display: grid; place-items: center; width: 40px; height: 40px; border-radius: 12px; background: var(--accent-soft); }
.brand-title { font: 700 17px/1.2 var(--serif); letter-spacing: .2px; }
.brand-sub { font-size: 12.5px; color: var(--muted); }
.top-actions { display: flex; align-items: center; gap: 8px; }
.timer {
  font: 600 14px/1 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  padding: 8px 12px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line);
  font-variant-numeric: tabular-nums;
}
.timer.running { border-color: var(--accent); color: var(--accent); }
.icon-btn {
  border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  width: 38px; height: 38px; border-radius: 999px; font-size: 18px; cursor: pointer;
}
.icon-btn:hover { border-color: var(--accent); }

/* nav */
.nav {
  display: flex; gap: 6px; padding: 10px clamp(14px, 4vw, 32px);
  overflow-x: auto; scrollbar-width: none;
}
.nav::-webkit-scrollbar { display: none; }
.nav a {
  white-space: nowrap; text-decoration: none; color: var(--muted);
  padding: 9px 16px; border-radius: 999px; font-weight: 600; font-size: 14.5px;
  border: 1px solid transparent;
}
.nav a:hover { color: var(--ink); background: var(--surface-2); }
.nav a.active { background: var(--accent); color: var(--accent-ink); }

/* layout */
main {
  width: 100%; max-width: 980px; margin: 0 auto; flex: 1;
  padding: 10px clamp(14px, 4vw, 32px) 56px; outline: none;
}
h1, h2, h3, h4 { font-family: var(--serif); line-height: 1.25; }
h1 { font-size: clamp(26px, 5vw, 38px); margin: 18px 0 6px; letter-spacing: -.3px; }
h2 { font-size: clamp(21px, 3.4vw, 26px); margin: 0 0 10px; }
h4 { font-size: 18px; margin: 26px 0 8px; color: var(--accent); }
.lead { color: var(--muted); font-size: 17px; max-width: 62ch; margin: 0 0 22px; }
.card {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  padding: clamp(16px, 3vw, 26px); box-shadow: var(--shadow); margin-bottom: 16px;
}
.grid { display: grid; gap: 14px; }
.grid.two { grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }

/* buttons */
.btn {
  display: inline-flex; align-items: center; gap: 8px; cursor: pointer;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  padding: 10px 18px; border-radius: 12px; font: 600 15px var(--sans);
}
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.07); }
.btn.small { padding: 6px 12px; font-size: 13.5px; border-radius: 10px; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }

/* plan */
.hero {
  display: grid; gap: 18px; padding: clamp(18px, 4vw, 30px);
  background: linear-gradient(135deg, var(--accent-soft), var(--surface));
  border: 1px solid var(--line); border-radius: 20px; margin-bottom: 18px;
}
.bigtimer { font: 700 clamp(40px, 9vw, 64px)/1 ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-variant-numeric: tabular-nums; letter-spacing: -1px; }
.progress { height: 10px; border-radius: 99px; background: var(--surface-2); overflow: hidden; border: 1px solid var(--line); }
.progress > i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .35s; }
.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.step {
  display: grid; grid-template-columns: auto 1fr auto; gap: 14px; align-items: center;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 14px 16px; transition: border-color .2s, opacity .2s;
}
.step.current { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.step.done { opacity: .6; }
.step.done .step-title { text-decoration: line-through; }
.step input[type=checkbox] { width: 22px; height: 22px; accent-color: var(--accent); cursor: pointer; }
.step-title { font-weight: 650; }
.step-goal { font-size: 14px; color: var(--muted); }
.min { font: 600 13px ui-monospace, Menlo, monospace; background: var(--surface-2); padding: 5px 10px; border-radius: 999px; white-space: nowrap; }
.step-links { display: flex; gap: 8px; margin-top: 6px; flex-wrap: wrap; }
.step-links a { font-size: 13.5px; color: var(--accent); font-weight: 600; text-decoration: none; }
.step-links a:hover { text-decoration: underline; }
.tag { display: inline-block; font-size: 12px; font-weight: 700; letter-spacing: .4px; text-transform: uppercase; padding: 3px 9px; border-radius: 99px; background: var(--accent-soft); color: var(--accent); }
.tag.warn { background: var(--warn-soft); color: var(--warn); }

/* content typography */
.content table { width: 100%; border-collapse: collapse; margin: 12px 0 18px; font-size: 15px; }
.content .tablewrap { overflow-x: auto; margin: 12px 0 18px; border: 1px solid var(--line); border-radius: 12px; }
.content .tablewrap table { margin: 0; min-width: 560px; }
.content th, .content td { padding: 9px 12px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
.content th { background: var(--surface-2); font-weight: 700; font-size: 13.5px; letter-spacing: .2px; }
.content tr:last-child td { border-bottom: 0; }
.content ul, .content ol { padding-left: 22px; }
.content li { margin: 5px 0; }
.content b { color: var(--ink); }
.tip {
  background: var(--warn-soft); border-left: 4px solid var(--warn); padding: 12px 16px;
  border-radius: 10px; margin: 16px 0; font-size: 15px;
}
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 6px 0 18px; }
.chip {
  cursor: pointer; border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  padding: 8px 14px; border-radius: 999px; font: 600 14px var(--sans);
}
.chip:hover { border-color: var(--accent); }
.chip.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

.block-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 6px; }
details.fold { border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); margin-bottom: 12px; }
details.fold > summary { cursor: pointer; padding: 14px 18px; font: 700 18px var(--serif); list-style: none; display: flex; justify-content: space-between; gap: 12px; }
details.fold > summary::-webkit-details-marker { display: none; }
details.fold > summary::after { content: "＋"; color: var(--accent); }
details.fold[open] > summary::after { content: "−"; }
details.fold > .content { padding: 0 18px 12px; }

/* tests */
.modes { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); margin: 16px 0; }
.mode {
  text-align: left; cursor: pointer; background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--radius); padding: 16px 18px; color: var(--ink); font: inherit;
  display: grid; gap: 4px; box-shadow: var(--shadow);
}
.mode:hover { border-color: var(--accent); transform: translateY(-1px); }
.mode b { font: 700 18px var(--serif); }
.mode span { color: var(--muted); font-size: 14px; }
.mode:disabled { opacity: .5; cursor: not-allowed; transform: none; }
.q-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; color: var(--muted); font-size: 14px; margin-bottom: 10px; }
.q-text { font: 600 clamp(19px, 3.2vw, 23px)/1.4 var(--serif); margin: 6px 0 18px; }
.opts { display: grid; gap: 10px; }
.opt {
  text-align: left; cursor: pointer; background: var(--surface); color: var(--ink);
  border: 1.5px solid var(--line); border-radius: 12px; padding: 13px 16px; font: 500 16px/1.45 var(--sans);
  display: grid; grid-template-columns: 28px 1fr; gap: 10px; align-items: start;
}
.opt .k { width: 26px; height: 26px; border-radius: 8px; background: var(--surface-2); display: grid; place-items: center; font: 700 13px ui-monospace, monospace; }
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt.right { border-color: var(--ok); background: var(--ok-soft); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.opt:disabled { cursor: default; }
.explain { margin-top: 16px; padding: 14px 16px; border-radius: 12px; background: var(--surface-2); font-size: 15.5px; }
.explain.ok { background: var(--ok-soft); }
.explain.bad { background: var(--bad-soft); }
.score { font: 800 clamp(48px, 12vw, 84px)/1 var(--serif); color: var(--accent); }
.bars { display: grid; gap: 10px; margin: 14px 0; }
.bar-row { display: grid; grid-template-columns: minmax(120px, 190px) 1fr 56px; gap: 10px; align-items: center; font-size: 14.5px; }
.bar-row .progress { height: 12px; }
.bar-row .progress > i.low { background: var(--bad); }
.bar-row .progress > i.mid { background: #c58a1b; }
.mistake { border-top: 1px solid var(--line); padding: 12px 0; }
.mistake:first-child { border-top: 0; }
.mistake .ans { color: var(--ok); font-weight: 600; }
.mistake .your { color: var(--bad); }

.foot { text-align: center; color: var(--muted); font-size: 13px; padding: 24px clamp(14px, 4vw, 32px) 36px; max-width: 760px; margin: 0 auto; }

@media (max-width: 560px) {
  .brand-sub { display: none; }
  .step { grid-template-columns: auto 1fr; }
  .step .min { grid-column: 2; justify-self: start; }
  .bar-row { grid-template-columns: 1fr 56px; }
  .bar-row .progress { grid-column: 1 / -1; order: 3; }
}

@media print {
  .topbar, .nav, .foot, .no-print, .chips { display: none !important; }
  body { background: #fff; color: #000; font-size: 12px; }
  .card, details.fold { box-shadow: none; border: 0; padding: 0; }
  details.fold > .content { display: block; }
  .content .tablewrap { overflow: visible; border: 0; }
  .content .tablewrap table { min-width: 0; }
}

</style>
</head>

</header>

<footer class="foot">

  Детали сверяй с учебником кафедры: Сапин (ГЭОТАР-Медиа), Гайворонский (Спецлит), Синельников (атлас, т. 4).

<script>
/* Контент: ЦНС (к контрольной) и ЧМН I–VI (к парам).
   Структура по рабочей программе «Анатомия» СЗГМУ им. И. И. Мечникова (ПЗ.27–33, ПЗ.36). */
window.CONTENT = {

plan: [
  { id: "map",  min: 5,  title: "Карта ЦНС: отделы и полости",             goal: "Назвать 5 отделов мозга и полость каждого." },
  { id: "sc",   min: 25, title: "Спинной мозг и его оболочки",             goal: "Границы, утолщения, ядра серого вещества, канатики, оболочки, пункция." },
  { id: "rh",   min: 30, title: "Ромбовидный мозг: продолговатый, мост, мозжечок, IV желудочек", goal: "Ядра ЧН по отделам, ножки мозжечка, дно IV желудочка." },
  { id: "mid",  min: 20, title: "Средний и промежуточный мозг",            goal: "Холмики, чёрная субстанция, красное ядро; таламус, гипоталамус." },
  { id: "tel",  min: 30, title: "Конечный мозг: извилины, ядра, капсула, желудочки, СМЖ", goal: "Корковые центры, базальные ядра, внутренняя капсула, ток ликвора." },
  { id: "path", min: 25, title: "Проводящие пути: 1-й, 2-й, 3-й нейрон",   goal: "Пройти каждый путь от рецептора до коры по нейронам." },
  { id: "test", min: 15, title: "Тест по ЦНС (экспресс)",                  goal: "20 вопросов, разобрать ошибки." },
  { id: "cn",   min: 25, title: "ЧМН I–VI (к паре)",                       goal: "Ядра, выход из мозга и черепа, ветви V, иннервация." }
],

blocks: {

/* ───────────────────────── 1. КАРТА ───────────────────────── */
map: {
  brief: `
<ul>
<li><b>ЦНС</b> = спинной мозг + головной мозг.</li>
<li>Головной мозг — <b>5 отделов</b>: продолговатый, задний (мост + мозжечок), средний, промежуточный, конечный.</li>
<li><b>Ствол мозга</b> = продолговатый + мост + средний мозг.</li>
<li>Развитие: нервная трубка → 3 пузыря (передний, средний, ромбовидный) → 5 пузырей.</li>
<li>Масса головного мозга взрослого — около 1300–1400 г.</li>
</ul>
<table>
<tr><th>Отдел</th><th>Полость</th></tr>
<tr><td>Спинной мозг</td><td>Центральный канал</td></tr>
<tr><td>Продолговатый мозг, мост, мозжечок</td><td>IV желудочек</td></tr>
<tr><td>Средний мозг</td><td>Водопровод мозга (Сильвиев)</td></tr>
<tr><td>Промежуточный мозг</td><td>III желудочек</td></tr>
<tr><td>Конечный мозг</td><td>Боковые желудочки (I и II)</td></tr>
</table>`,
  detail: `
<h4>Эмбриогенез</h4>
<p>Из нервной трубки на 4-й неделе формируются три мозговых пузыря, затем пять:</p>
<table>
<tr><th>3 пузыря</th><th>5 пузырей</th><th>Что из него развивается</th><th>Полость</th></tr>
<tr><td rowspan="2">Передний (prosencephalon)</td><td>Конечный (telencephalon)</td><td>Полушария, базальные ядра, обонятельный мозг</td><td>Боковые желудочки</td></tr>
<tr><td>Промежуточный (diencephalon)</td><td>Таламус, эпиталамус, метаталамус, гипоталамус, субталамус; сетчатка и зрительный нерв</td><td>III желудочек</td></tr>
<tr><td>Средний (mesencephalon)</td><td>Средний мозг</td><td>Крыша (холмики), ножки мозга</td><td>Водопровод мозга</td></tr>
<tr><td rowspan="2">Ромбовидный (rhombencephalon)</td><td>Задний (metencephalon)</td><td>Мост, мозжечок</td><td rowspan="2">IV желудочек</td></tr>
<tr><td>Продолговатый (myelencephalon)</td><td>Продолговатый мозг</td></tr>
</table>
<h4>Как делится мозг на практике</h4>
<ul>
<li><b>Ствол</b>: продолговатый + мост + средний мозг. Из ствола выходят III–XII пары ЧН (I и II — производные переднего мозга).</li>
<li><b>Перешеек ромбовидного мозга</b> — участок между мостом и средним мозгом (верхние мозжечковые ножки, верхний мозговой парус).</li>
<li><b>Серое и белое вещество</b>: в спинном мозге серое внутри, белое снаружи; в полушариях есть и кора (поверхностное серое), и подкорковые ядра, и белое вещество между ними.</li>
</ul>
<div class="tip">Порядок «снизу вверх» для скелета ответа на экзамене: спинной → продолговатый → мост → мозжечок → IV желудочек → средний → промежуточный → конечный.</div>`
},

/* ───────────────────────── 2. СПИННОЙ МОЗГ ───────────────────────── */
sc: {
  brief: `
<ul>
<li>Длина 41–45 см, масса 34–38 г. Верхняя граница — уровень большого затылочного отверстия (перекрёст пирамид), нижняя — L1–L2.</li>
<li><b>31 сегмент</b>: 8 шейных, 12 грудных, 5 поясничных, 5 крестцовых, 1 копчиковый.</li>
<li>Утолщения: <b>шейное</b> (C5–Th2) и <b>пояснично-крестцовое</b> (L1–S2). Ниже — мозговой конус, концевая нить, конский хвост.</li>

  t("path", "Какие волокна перекрещиваются в зрительном перекрёсте?", "От медиальных (носовых) половин сетчаток", ["От латеральных (височных) половин", "Все волокна", "Волокна не перекрещиваются"], "Поражение перекрёста даёт битемпоральную гемианопсию.");
  t("path", "3-й нейрон зрительного пути находится в:", "Латеральном коленчатом теле", ["Медиальном коленчатом теле", "Верхних холмиках", "Шпорной борозде"], "Затем зрительная лучистость Грациоле → поле 17.");
  t("path", "1-й нейрон слухового пути лежит в:", "Спиральном узле улитки", ["Переднем улитковом ядре", "Нижнем холмике", "Медиальном коленчатом теле"], "2-й — улитковые ядра, 3-й — нижние холмики и медиальное коленчатое тело.");
  t("path", "2-й нейрон пути болевой и температурной чувствительности лица лежит в:", "Ядре спинномозгового пути тройничного нерва", ["Главном чувствительном ядре", "Ядре среднемозгового пути", "Двойном ядре"], "1-й — тройничный узел; 3-й — VPM.");

  /* ───── ЧМН I–VI ───── */
  t("cn", "I пара выходит из полости черепа через:", "Решётчатую пластинку", ["Зрительный канал", "Верхнюю глазничную щель", "Круглое отверстие"], "Обонятельные нити → обонятельная луковица.");
  t("cn", "Какие ЧН являются производными переднего мозга и не имеют ядер в стволе?", "I и II", ["III и IV", "V и VI", "Все ЧН имеют ядра в стволе"], "II — отросток промежуточного мозга, поэтому одет мозговыми оболочками.");
  t("cn", "II пара выходит из глазницы через:", "Зрительный канал", ["Верхнюю глазничную щель", "Нижнюю глазничную щель", "Подглазничный канал"], "Вместе с глазной артерией.");
  t("cn", "Из межножковой ямки выходит нерв:", "III (глазодвигательный)", ["IV", "VI", "V"], "IV — дорсально; VI — между мостом и пирамидой.");
  t("cn", "Какую мышцу глаза иннервирует IV пара?", "Верхнюю косую", ["Нижнюю косую", "Верхнюю прямую", "Латеральную прямую"], "VI — латеральная прямая; остальные — III.");
  t("cn", "Парасимпатическое ядро III пары называется:", "Добавочное ядро (Якубовича–Эдингера–Вестфаля)", ["Двойное ядро", "Дорсальное ядро X", "Верхнее слюноотделительное ядро"], "Волокна идут через ресничный узел к сфинктеру зрачка и ресничной мышце.");
  t("cn", "Какую мышцу века иннервирует III пара?", "Мышцу, поднимающую верхнее веко", ["Круговую мышцу глаза", "Лобное брюшко надчерепной мышцы", "Мышцу гордецов"], "Поражение — птоз. Круговая мышца глаза — VII.");
  t("cn", "Какой ЧН проходит в просвете пещеристого синуса?", "VI (отводящий)", ["III", "IV", "V2"], "III, IV, V1 и V2 лежат в боковой стенке; VI — рядом с внутренней сонной артерией.");
  t("cn", "Ядро отводящего нерва находится:", "В мосту, под лицевым бугорком", ["В среднем мозге на уровне нижних холмиков", "В продолговатом мозге", "В таламусе"], "Колено VII огибает ядро VI.");
  t("cn", "Через верхнюю глазничную щель проходят:", "III, IV, VI и V1", ["II и V2", "V2 и V3", "III, IV, V3"], "II — через зрительный канал.");
  t("cn", "Через какое отверстие выходит V2?", "Круглое отверстие", ["Овальное отверстие", "Верхняя глазничная щель", "Остистое отверстие"], "V1 — верхняя глазничная щель; V3 — овальное.");
  t("cn", "Через какое отверстие выходит V3?", "Овальное отверстие", ["Круглое отверстие", "Остистое отверстие", "Шилососцевидное отверстие"], "Остистое — для средней менингеальной артерии.");
  t("cn", "Тройничный узел (Гассеров) лежит:", "На передней поверхности пирамиды височной кости", ["В крылонёбной ямке", "В подвисочной ямке", "В пещеристом синусе"], "В тройничной (Меккелевой) полости.");
  t("cn", "Какой ветвью V3 иннервируются передние 2/3 языка (общая чувствительность)?", "Язычным нервом", ["Нижним луночковым нервом", "Щёчным нервом", "Подбородочным нервом"], "Вкус этого отдела — через барабанную струну (VII).");
  t("cn", "Какая ветвь V2 выходит через подглазничное отверстие?", "Подглазничный нерв", ["Скуловой нерв", "Крылонёбные нервы", "Подбородочный нерв"], "Подбородочный — ветвь V3.");
  t("cn", "Какой ветвью V3 является подбородочный нерв?", "Нижнего луночкового", ["Язычного", "Щёчного", "Ушно-височного"], "Выходит через подбородочное отверстие.");
  t("cn", "К какому нерву относятся лобный, слёзный и носоресничный нервы?", "V1 (глазной)", ["V2", "V3", "III"], "Все проходят через верхнюю глазничную щель.");
  t("cn", "Жевательную мышцу иннервирует:", "Жевательный нерв — двигательная ветвь V3", ["Щёчный нерв (V3)", "Ветвь лицевого нерва (VII)", "Подглазничный нерв (V2)"], "Щёчный нерв — чувствительный. Двигательные ветви V3: жевательный, глубокие височные, крыловидные и другие.");
  t("cn", "Парасимпатический узел, связанный с V3 и IX, — это:", "Ушной узел", ["Ресничный узел", "Крылонёбный узел", "Поднижнечелюстной узел"], "Волокна идут к околоушной железе.");
  t("cn", "Ресничный узел связан с:", "III и V1 (носоресничным нервом)", ["VII и V2", "IX и V3", "X и V3"], "Парасимпатика — от III.");
  t("cn", "Крылонёбный узел связан с:", "V2 и VII", ["V1 и III", "V3 и IX", "V3 и X"], "Парасимпатика идёт по большому каменистому нерву (VII).");
  t("cn", "Афферентная часть роговичного рефлекса идёт по:", "V1 (носоресничный → длинные ресничные нервы)", ["V2", "VII", "III"], "Эфферентная часть — VII (мигание).");
  t("cn", "Какое ядро V связано с проприоцепцией жевательных мышц?", "Ядро среднемозгового пути", ["Главное чувствительное ядро", "Ядро спинномозгового пути", "Двигательное ядро"], "Лежит в среднем мозге.");
  t("cn", "Как выходит V нерв?", "Из латеральной части моста двумя корешками", ["Из борозды между мостом и пирамидой", "Из межножковой ямки", "Дорсально под нижними холмиками"], "Большой чувствительный и малый двигательный корешок.");
  t("cn", "Какие из I–VI ЧН чисто чувствительные?", "I и II", ["III и IV", "V и VI", "I, II и V"], "V — смешанный; III, IV, VI — двигательные.");
  t("cn", "Дилататор зрачка иннервируется:", "Симпатическими волокнами от верхнего шейного узла", ["III парой", "IV парой", "VI парой"], "Сфинктер зрачка — III пара (парасимпатика).");
  t("cn", "Мышца, напрягающая барабанную перепонку, иннервируется:", "V3", ["VII", "IX", "V2"], "Двигательная ветвь V3.");
  t("cn", "Решётчатый нерв (n. ethmoidalis anterior) — ветвь:", "Носоресничного нерва (V1)", ["Подглазничного нерва (V2)", "Язычного нерва (V3)", "Скулового нерва (V2)"], "Иннервирует слизистую носа и кожу наружного носа.");

  window.TESTS = Q;
})();

</script>
<script>
(function () {
  "use strict";

  var C = window.CONTENT, TESTS = window.TESTS;
  var app = document.getElementById("app");

  var TOPICS = {
    map: "Карта ЦНС", sc: "Спинной мозг", rh: "Ромбовидный мозг",
    mid: "Средний и промежуточный", tel: "Конечный мозг", path: "Проводящие пути", cn: "ЧМН I–VI"
  };
  var CNS_IDS = ["map", "sc", "rh", "mid", "tel", "path"];
  var TOTAL_SEC = C.plan.reduce(function (s, p) { return s + p.min; }, 0) * 60;

  /* ───────── storage ───────── */
  var mem = {};
  function load() {
    try { var s = localStorage.getItem("anat.v1"); if (s) return JSON.parse(s); } catch (e) {}
    return mem.state || null;
  }
  function save() {
    try { localStorage.setItem("anat.v1", JSON.stringify(state)); } catch (e) { mem.state = state; }
  }
  var state = load() || {};
  state.done = state.done || {};
  state.wrong = state.wrong || {};
  state.remaining = typeof state.remaining === "number" ? state.remaining : TOTAL_SEC;
  state.theme = state.theme || "";
  var running = false, lastTs = 0;

  /* ───────── helpers ───────── */
  function el(tag, attrs, html) {
    var n = document.createElement(tag);
    if (attrs) for (var k in attrs) {
      if (k === "class") n.className = attrs[k];
      else if (k.slice(0, 2) === "on") n.addEventListener(k.slice(2), attrs[k]);
      else n.setAttribute(k, attrs[k]);
    }
    if (html != null) n.innerHTML = html;
    return n;
  }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function fmt(sec) {
    sec = Math.max(0, Math.round(sec));
    var h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60;
    return h + ":" + (m < 10 ? "0" : "") + m + ":" + (s < 10 ? "0" : "") + s;
  }
  function shuffle(a) {
    a = a.slice();
    for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; }
    return a;
  }
  function wrapTables(root) {
    root.querySelectorAll("table").forEach(function (t) {
      if (t.parentNode.classList.contains("tablewrap")) return;
      var w = el("div", { class: "tablewrap" });
      t.parentNode.insertBefore(w, t); w.appendChild(t);
    });
  }
  function html(strOrNode) { return strOrNode; }

  /* ───────── theme ───────── */
  function applyTheme() {
    if (state.theme) document.documentElement.setAttribute("data-theme", state.theme);
    else document.documentElement.removeAttribute("data-theme");
  }
  document.getElementById("themeBtn").addEventListener("click", function () {
    var dark = state.theme ? state.theme === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
    state.theme = dark ? "light" : "dark"; save(); applyTheme();
  });
  applyTheme();

  /* ───────── timer ───────── */
  var miniEl = document.getElementById("timerMini"), miniText = document.getElementById("timerMiniText");
  function tick() {
    var now = Date.now();
    if (running) {
      state.remaining = Math.max(0, state.remaining - (now - lastTs) / 1000);
      lastTs = now;
      if (state.remaining <= 0) running = false;
    }
    miniText.textContent = fmt(state.remaining);
    miniEl.classList.toggle("running", running);
    var big = document.getElementById("bigTimer");
    if (big) big.textContent = fmt(state.remaining);
    var bar = document.getElementById("timeBar");
    if (bar) bar.style.width = (100 - state.remaining / TOTAL_SEC * 100) + "%";
    var btn = document.getElementById("timerToggle");
    if (btn) btn.textContent = running ? "Пауза" : (state.remaining < TOTAL_SEC ? "Продолжить" : "Старт");
  }
  setInterval(function () { tick(); if (running) save(); }, 1000);
  miniEl.style.cursor = "pointer";
  miniEl.addEventListener("click", function () { toggleTimer(); });
  function toggleTimer() {
    if (state.remaining <= 0) return;
    running = !running; lastTs = Date.now(); save(); tick();
  }
  function resetTimer() { running = false; state.remaining = TOTAL_SEC; save(); tick(); }

  /* ───────── router ───────── */
  var routes = { plan: renderPlan, brief: renderBrief, detail: renderDetail, cn: renderCN, tests: renderTests };
  function route() {
    var h = (location.hash || "#plan").slice(1).split("/");
    var name = routes[h[0]] ? h[0] : "plan";
    document.querySelectorAll("#nav a").forEach(function (a) { a.classList.toggle("active", a.dataset.route === name); });
    app.innerHTML = "";
    quiz = null;
    routes[name](h[1]);
    wrapTables(app);
    tick();
    window.scrollTo(0, 0);
  }
  window.addEventListener("hashchange", route);

  /* ───────── план ───────── */
  function renderPlan() {
    var doneMin = 0;
    C.plan.forEach(function (p) { if (state.done[p.id]) doneMin += p.min; });
    var pct = Math.round(doneMin / (TOTAL_SEC / 60) * 100);
    var currentId = null;
    for (var i = 0; i < C.plan.length; i++) if (!state.done[C.plan[i].id]) { currentId = C.plan[i].id; break; }

    app.appendChild(el("h1", null, "План подготовки на 2 ч 55 мин"));
    app.appendChild(el("p", { class: "lead" },
      "Контрольная по ЦНС — глубоко (блоки 1–7). Черепные нервы I–VI — для пары (блок 8). " +
      "Иди сверху вниз: прочитай краткий конспект блока, затем подробный, отметь галочкой."));

    var hero = el("section", { class: "hero" });
    hero.innerHTML =
      '<div class="row" style="justify-content:space-between">' +
      '<div><div class="tag">Осталось по таймеру</div><div class="bigtimer" id="bigTimer">' + fmt(state.remaining) + '</div></div>' +
      '<div class="row no-print"><button class="btn primary" id="timerToggle">Старт</button><button class="btn" id="timerReset">Сбросить</button></div></div>' +
      '<div><div class="progress" title="Время"><i id="timeBar"></i></div></div>' +
      '<div><div class="row" style="justify-content:space-between;margin-bottom:6px"><span class="tag">Пройдено блоков</span><b>' + pct + '%</b></div>' +
      '<div class="progress"><i style="width:' + pct + '%"></i></div></div>';
    app.appendChild(hero);
    hero.querySelector("#timerToggle").addEventListener("click", toggleTimer);
    hero.querySelector("#timerReset").addEventListener("click", resetTimer);

    var ul = el("ol", { class: "steps" });
    C.plan.forEach(function (p, idx) {
      var li = el("li", { class: "step" + (state.done[p.id] ? " done" : "") + (p.id === currentId ? " current" : "") });
      var cb = el("input", { type: "checkbox", "aria-label": "Блок выполнен" });
      cb.checked = !!state.done[p.id];
      cb.addEventListener("change", function () { state.done[p.id] = cb.checked; save(); route(); });
      var links;
      if (p.id === "test") links = '<a href="#tests">Открыть тест →</a>';
      else if (p.id === "cn") links = '<a href="#cn">Конспект ЧМН →</a><a href="#tests">Тест по ЧМН →</a>';
      else links = '<a href="#brief">Краткий конспект →</a><a href="#detail/' + p.id + '">Подробно →</a>';
      var mid = el("div", null,
        '<div class="step-title">' + (idx + 1) + '. ' + esc(p.title) + '</div>' +
        '<div class="step-goal">Цель: ' + esc(p.goal) + '</div>' +
        '<div class="step-links">' + links + '</div>');
      li.appendChild(cb); li.appendChild(mid);
      li.appendChild(el("span", { class: "min" }, p.min + " мин"));
      ul.appendChild(li);
    });
    app.appendChild(ul);

    app.appendChild(el("div", { class: "card content", style: "margin-top:18px" },
      "<h2>Как использовать</h2><ol>" +
      "<li>Читай <b>краткий конспект</b> блока, затем <b>подробный</b> — по таблицам.</li>" +
      "<li>Проводящие пути проговаривай вслух по схеме: рецептор → 1-й → 2-й → 3-й нейрон → кора.</li>" +
      "<li>В блоке 7 пройди экспресс-тест. Ошибки сохраняются — потом открой «Работа над ошибками».</li>" +
      "<li>ЧМН I–VI — отдельно, для занятия: ядра, выход из мозга и черепа, ветви V.</li></ol>"));
  }

  /* ───────── краткий конспект ───────── */
  function renderBrief() {
    app.appendChild(el("h1", null, "Краткий конспект: ЦНС"));
    app.appendChild(el("p", { class: "lead" }, "Минимум к контрольной. Подробности — во вкладке «Подробно»."));
    app.appendChild(el("div", { class: "row no-print", style: "margin-bottom:14px" },
      '<button class="btn small" id="printBtn">Печать / в PDF</button>'));
    app.querySelector("#printBtn").addEventListener("click", function () { window.print(); });
    C.plan.forEach(function (p, i) {
      if (!C.blocks[p.id]) return;
      var d = el("details", { class: "fold", open: "" });
      d.appendChild(el("summary", null, (i + 1) + ". " + esc(p.title)));
      d.appendChild(el("div", { class: "content" }, C.blocks[p.id].brief));
      app.appendChild(d);
    });
    app.appendChild(el("p", { class: "no-print" }, '<a class="btn primary" href="#tests">Проверить себя тестом</a>'));
  }

  /* ───────── подробный конспект ───────── */
  function renderDetail(id) {
    if (!id || !C.blocks[id] || id === "cn") id = "sc";
    app.appendChild(el("h1", null, "Подробный конспект: ЦНС"));
    var chips = el("div", { class: "chips no-print" });
    CNS_IDS.forEach(function (k) {
      var p = C.plan.filter(function (x) { return x.id === k; })[0];
      var a = el("a", { class: "chip" + (k === id ? " on" : ""), href: "#detail/" + k, style: "text-decoration:none" }, esc(TOPICS[k]));
      chips.appendChild(a);
    });
    app.appendChild(chips);
    var p = C.plan.filter(function (x) { return x.id === id; })[0];
    var card = el("article", { class: "card content" });
    card.appendChild(el("div", { class: "block-head" }, "<h2>" + esc(p.title) + '</h2><span class="min">' + p.min + " мин</span>"));
    card.appendChild(el("p", { class: "step-goal" }, "Цель: " + esc(p.goal)));
    card.appendChild(el("div", null, C.blocks[id].detail));
    app.appendChild(card);
    var idx = CNS_IDS.indexOf(id), nav = el("div", { class: "row no-print" });
    if (idx > 0) nav.appendChild(el("a", { class: "btn", href: "#detail/" + CNS_IDS[idx - 1] }, "← " + esc(TOPICS[CNS_IDS[idx - 1]])));
    if (idx < CNS_IDS.length - 1) nav.appendChild(el("a", { class: "btn primary", href: "#detail/" + CNS_IDS[idx + 1] }, esc(TOPICS[CNS_IDS[idx + 1]]) + " →"));
    else nav.appendChild(el("a", { class: "btn primary", href: "#tests" }, "К тестам →"));
    app.appendChild(nav);
  }

  /* ───────── ЧМН ───────── */
  function renderCN(mode) {
    mode = mode === "detail" ? "detail" : "brief";
    app.appendChild(el("h1", null, "Черепные нервы I–VI"));
    app.appendChild(el("p", { class: "lead" }, "Для занятия ПЗ.36. Сначала таблица-минимум, потом разбор по каждой паре."));
    var chips = el("div", { class: "chips no-print" });
    chips.appendChild(el("a", { class: "chip" + (mode === "brief" ? " on" : ""), href: "#cn/brief", style: "text-decoration:none" }, "Краткий конспект"));
    chips.appendChild(el("a", { class: "chip" + (mode === "detail" ? " on" : ""), href: "#cn/detail", style: "text-decoration:none" }, "Подробный конспект"));
    app.appendChild(chips);
    app.appendChild(el("article", { class: "card content" }, C.cn[mode]));
    app.appendChild(el("p", { class: "no-print" }, '<a class="btn primary" href="#tests">Тест по ЧМН</a>'));
  }

  /* ───────── тесты ───────── */
  var quiz = null;
  function wrongList() { return TESTS.filter(function (q) { return state.wrong[q.q]; }); }

  function renderTests() {
    var cns = TESTS.filter(function (q) { return q.topic !== "cn"; });
    var cn = TESTS.filter(function (q) { return q.topic === "cn"; });
    var wr = wrongList();
    app.appendChild(el("h1", null, "Тесты"));
    app.appendChild(el("p", { class: "lead" },
      "Всего " + TESTS.length + " вопросов: " + cns.length + " по ЦНС и " + cn.length + " по ЧМН I–VI. Варианты перемешиваются, после каждого ответа — пояснение."));
    var grid = el("div", { class: "modes" });
    function mode(title, desc, fn, disabled) {
      var b = el("button", { class: "mode" }, "<b>" + title + "</b><span>" + desc + "</span>");
      if (disabled) b.disabled = true;
      b.addEventListener("click", fn);
      grid.appendChild(b);
    }
    mode("Экспресс ЦНС", "20 случайных вопросов, около 15 минут", function () { startQuiz("Экспресс ЦНС", shuffle(cns).slice(0, 20)); });
    mode("Полный тест ЦНС", cns.length + " вопросов по всем темам", function () { startQuiz("Полный тест ЦНС", shuffle(cns)); });
    mode("ЧМН I–VI", cn.length + " вопросов к занятию", function () { startQuiz("ЧМН I–VI", shuffle(cn)); });
    mode("Работа над ошибками", wr.length ? wr.length + " вопросов, где были ошибки" : "Пока нет ошибок", function () { startQuiz("Работа над ошибками", shuffle(wr)); }, !wr.length);
    app.appendChild(grid);

    app.appendChild(el("h2", { style: "margin-top:26px" }, "По теме"));
    var chips = el("div", { class: "chips" });
    Object.keys(TOPICS).forEach(function (k) {
      var list = TESTS.filter(function (q) { return q.topic === k; });
      var b = el("button", { class: "chip" }, esc(TOPICS[k]) + " · " + list.length);
      b.addEventListener("click", function () { startQuiz(TOPICS[k], shuffle(list)); });
      chips.appendChild(b);
    });
    app.appendChild(chips);
    if (wr.length) {
      app.appendChild(el("p", null, '<button class="btn small" id="clearWrong">Очистить список ошибок</button>'));
      app.querySelector("#clearWrong").addEventListener("click", function () { state.wrong = {}; save(); route(); });
    }
  }

  function startQuiz(title, list) {
    if (!list.length) return;
    quiz = {
      title: title, i: 0, answered: false,
      items: list.map(function (q) {
        var opts = shuffle([q.c].concat(q.w));
        return { q: q, opts: opts, pick: -1 };
      })
    };
    renderQuestion();
  }

  function renderQuestion() {
    app.innerHTML = "";
    var it = quiz.items[quiz.i], total = quiz.items.length;
    var right = quiz.items.filter(function (x) { return x.pick >= 0 && x.opts[x.pick] === x.q.c; }).length;
    var card = el("section", { class: "card" });
    card.appendChild(el("div", { class: "q-top" },
      "<span>" + esc(quiz.title) + " · " + (quiz.i + 1) + " из " + total + "</span><span>Верно: " + right + "</span>"));
    card.appendChild(el("div", { class: "progress", style: "margin-bottom:14px" }, '<i style="width:' + (quiz.i / total * 100) + '%"></i>'));
    card.appendChild(el("div", { class: "tag" }, esc(TOPICS[it.q.topic])));
    var q = el("div", { class: "q-text" }); q.textContent = it.q.q; card.appendChild(q);
    var box = el("div", { class: "opts" });
    var letters = ["А", "Б", "В", "Г"];
    var explain = el("div");
    var next = el("button", { class: "btn primary", style: "margin-top:16px;display:none" },
      quiz.i === total - 1 ? "Результат" : "Дальше");
    next.addEventListener("click", function () {
      if (quiz.i === total - 1) renderResult(); else { quiz.i++; renderQuestion(); }
    });
    it.opts.forEach(function (o, idx) {
      var b = el("button", { class: "opt" });
      b.innerHTML = '<span class="k">' + letters[idx] + "</span><span></span>";
      b.lastChild.textContent = o;
      b.addEventListener("click", function () { answer(idx); });
      box.appendChild(b);
    });
    function answer(idx) {
      if (it.pick >= 0) return;
      it.pick = idx;
      var ok = it.opts[idx] === it.q.c;
      if (ok) delete state.wrong[it.q.q]; else state.wrong[it.q.q] = true;
      save();
      Array.prototype.forEach.call(box.children, function (b, j) {
        b.disabled = true;
        if (it.opts[j] === it.q.c) b.classList.add("right");
        else if (j === idx) b.classList.add("wrong");
      });
      explain.className = "explain " + (ok ? "ok" : "bad");
      explain.innerHTML = "<b>" + (ok ? "Верно. " : "Неверно. Правильно: " + esc(it.q.c) + ". ") + "</b>" + esc(it.q.e);
      next.style.display = "inline-flex";
      next.focus();
    }
    card.appendChild(box); card.appendChild(explain); card.appendChild(next);
    app.appendChild(card);
    quiz.key = function (e) {
      var n = { "1": 0, "2": 1, "3": 2, "4": 3 }[e.key];
      if (n != null && it.pick < 0 && n < it.opts.length) answer(n);
      else if (e.key === "Enter" && it.pick >= 0) next.click();
    };
    window.scrollTo(0, 0);
  }

  document.addEventListener("keydown", function (e) { if (quiz && quiz.key) quiz.key(e); });

  function renderResult() {
    app.innerHTML = "";
    var items = quiz.items, total = items.length;
    var okN = items.filter(function (x) { return x.opts[x.pick] === x.q.c; }).length;
    var pct = Math.round(okN / total * 100);
    var verdict = pct >= 85 ? "Отлично, можно идти дальше." : pct >= 65 ? "Хорошо, но разбери ошибки ниже." : "Есть пробелы: перечитай подробный конспект по темам с низким результатом.";
    var card = el("section", { class: "card" });
    card.appendChild(el("div", { class: "tag" }, esc(quiz.title)));
    card.appendChild(el("div", { class: "score" }, pct + "%"));
    card.appendChild(el("p", { class: "lead" }, okN + " из " + total + ". " + verdict));

    var byTopic = {};
    items.forEach(function (x) {
      var t = byTopic[x.q.topic] = byTopic[x.q.topic] || { n: 0, ok: 0 };
      t.n++; if (x.opts[x.pick] === x.q.c) t.ok++;
    });
    var bars = el("div", { class: "bars" });
    Object.keys(byTopic).forEach(function (k) {
      var t = byTopic[k], p = Math.round(t.ok / t.n * 100);
      var row = el("div", { class: "bar-row" },
        "<span>" + esc(TOPICS[k]) + '</span><div class="progress"><i class="' + (p < 60 ? "low" : p < 85 ? "mid" : "") + '" style="width:' + p + '%"></i></div><b>' + t.ok + "/" + t.n + "</b>");
      bars.appendChild(row);
    });
    card.appendChild(bars);

    var bad = items.filter(function (x) { return x.opts[x.pick] !== x.q.c; });
    if (bad.length) {
      card.appendChild(el("h2", { style: "margin-top:22px" }, "Ошибки (" + bad.length + ")"));
      bad.forEach(function (x) {
        var m = el("div", { class: "mistake" });
        var q = el("div"); q.innerHTML = "<b></b>"; q.firstChild.textContent = x.q.q; m.appendChild(q);
        var y = el("div", { class: "your" }); y.textContent = "Твой ответ: " + x.opts[x.pick]; m.appendChild(y);
        var a = el("div", { class: "ans" }); a.textContent = "Верно: " + x.q.c; m.appendChild(a);
        var e = el("div", { class: "step-goal" }); e.textContent = x.q.e; m.appendChild(e);
        card.appendChild(m);
      });
    }
    var row = el("div", { class: "row", style: "margin-top:20px" });
    if (bad.length) {
      var again = el("button", { class: "btn primary" }, "Повторить ошибки");
      again.addEventListener("click", function () { startQuiz("Ошибки: " + quiz.title, shuffle(bad.map(function (x) { return x.q; }))); });
      row.appendChild(again);
    }
    var menu = el("a", { class: "btn", href: "#tests" }, "К выбору теста");
    menu.addEventListener("click", function () { if (location.hash === "#tests") route(); });
    row.appendChild(menu);
    card.appendChild(row);
    app.appendChild(card);
    quiz.key = null;
    window.scrollTo(0, 0);
  }

  route();
})();

</script>
</body>
</html>
